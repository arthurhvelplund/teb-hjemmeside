<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire retninger for Det sker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--foreground,#26362c);background:transparent}.chooser{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding-right:70px}.choice{border:1px solid var(--border,#d7d2c6);border-radius:6px;background:var(--card,#fff);color:var(--foreground,#26362c);padding:10px 12px;font:inherit;font-size:13px;cursor:pointer}.choice[aria-pressed=true]{background:var(--primary,#263e2c);color:var(--primary-foreground,#fff);border-color:transparent}.direction{margin:0 0 14px;font-size:13px;line-height:1.5;color:var(--muted-foreground,#666)}
.teb{--paper:#f5f1e6;--surface:#fffdf7;--green:#263f30;--ink:#25362a;--muted:#73786d;--line:#dfdacb;--orange:#b95d36;background:var(--paper);color:var(--ink);border-radius:10px;overflow:hidden;font-family:Arial,sans-serif}.teb button,.teb input{font-family:inherit}.teb button{cursor:pointer}.teb-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);gap:14px}.teb-mark{font:italic 24px Georgia,serif;display:flex;align-items:center;gap:9px}.teb-mark strong{font:700 17px Arial,sans-serif;letter-spacing:2px}.teb-nav{display:flex;gap:16px;font-size:11px;color:var(--muted)}.teb-nav b{color:var(--green)}.teb-main{padding:20px 24px 24px}.teb-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.teb h1{font:38px/1.05 Georgia,serif;margin:0}.teb h1 em{font-weight:400}.teb-action{border:0;border-radius:30px;background:var(--green);color:var(--surface);padding:12px 17px;font-size:12px;white-space:nowrap}.teb-period{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:16px}.teb-period h2{font:23px Georgia,serif;margin:0}.teb-period .teb-small{font-size:11px}.teb-small{font-size:12px;color:var(--muted);line-height:1.45}.teb-switch{display:flex;align-items:center;gap:12px;font-size:12px}.teb-switch .on{color:var(--green);border-bottom:2px solid var(--green);padding-bottom:5px}.teb-dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:16px}.teb-day{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:9px 3px;text-align:center;display:grid;gap:3px;color:var(--muted);font-size:11px}.teb-day b{color:var(--green);font-size:17px}.teb-day.active{background:var(--green);color:var(--surface);border-color:var(--green)}.teb-day.active b{color:var(--surface)}.teb-photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.teb-event{padding:0;border:1px solid var(--line);background:var(--surface);border-radius:7px;text-align:left;overflow:hidden;color:var(--ink);display:block;width:100%;min-width:0}.teb-event img{width:100%;height:128px;object-fit:cover;display:block}.teb-event-copy{padding:12px;display:grid;gap:6px}.teb-event h3{font:19px/1.2 Georgia,serif;margin:0;overflow-wrap:anywhere}.teb-date-label{font-size:11px;color:var(--orange);font-weight:600}.teb-event-location{font-size:11px;color:var(--muted)}.teb-text-event{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0;text-align:left;width:100%;color:var(--ink);font-size:13px}.teb-text-event .teb-date-label{min-width:82px}.teb-text-event b{flex:1}.teb-paper{display:flex;gap:12px;align-items:center;background:#eae5d5;padding:12px 16px;border:0;border-radius:6px;color:var(--green);width:100%;text-align:left;margin-top:18px}.teb-paper img{height:58px;width:42px;object-fit:cover;object-position:top;transform:rotate(-4deg);border:1px solid #c7c4b6}.teb-paper .teb-paper-copy{flex:1;display:grid;gap:4px}.teb-paper strong{font:19px Georgia,serif}.teb-paper .teb-small{color:#64705e}.teb-paper .teb-arrow{font-size:12px;white-space:nowrap}.teb-news{border-top:1px solid var(--line);padding-top:17px;margin-top:22px}.teb-news h2{font:26px Georgia,serif;margin:0 0 14px}.teb-news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.teb-news-item img{display:block;width:100%;height:76px;object-fit:cover;border-radius:4px}.teb-news-item h3{font:16px/1.25 Georgia,serif;margin:8px 0}.teb-source{font-size:10px;color:var(--orange)}
.teb-fixed-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}.teb-fixed-day{min-width:0;border-right:1px solid var(--line);min-height:245px;padding:0 5px 10px}.teb-fixed-day:last-child{border:0}.teb-fixed-label{text-align:center;display:grid;gap:3px;font-size:10px;background:#eeeadf;margin:0 -5px 10px;padding:10px 2px}.teb-fixed-label strong{font-size:19px}.teb-chip{display:block;width:100%;background:#e6eadf;border:0;border-left:2px solid #5d7659;padding:7px 5px;text-align:left;border-radius:3px;color:var(--ink);margin-top:6px;font-size:11px;line-height:1.35;overflow-wrap:anywhere}.teb-chip span{display:block;font-size:10px;color:var(--orange);margin-bottom:5px}.teb-chip img{display:block;width:calc(100% + 10px);height:48px;object-fit:cover;margin:-7px -5px 6px}.teb-fixed-empty{text-align:center;color:#a29f93;font-size:18px;padding:36px 0}.teb-ledger{display:grid;gap:12px}.teb-ledger-day{display:grid;grid-template-columns:60px minmax(0,1fr);gap:15px}.teb-ledger-date{padding-top:8px;text-align:center;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.teb-ledger-date strong{display:block;font:32px Georgia,serif;color:var(--green);margin-top:3px}.teb-ledger-events{display:grid;gap:8px}.teb-row-event{display:grid;grid-template-columns:80px minmax(0,1fr) 15px;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:0 12px 0 0;text-align:left;width:100%;overflow:hidden}.teb-row-event img{width:80px;height:76px;object-fit:cover}.teb-row-event h3{font:18px Georgia,serif;margin:4px 0}.teb-row-event .teb-event-location{font-size:11px}.teb-row-event .teb-date-label{font-size:10px}.teb-focus-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(160px,1fr);gap:17px;align-items:start}.teb-feature{background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow:hidden;width:100%;padding:0;text-align:left;color:var(--ink)}.teb-feature img{width:100%;height:185px;object-fit:cover;display:block}.teb-feature-copy{padding:16px}.teb-feature h3{font:27px/1.1 Georgia,serif;margin:8px 0}.teb-feature p{font-size:12px;line-height:1.5;margin:10px 0;color:var(--muted)}.teb-aside h3{font:20px Georgia,serif;margin:0 0 9px}.teb-aside-event{display:block;width:100%;text-align:left;padding:13px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink)}.teb-aside-event strong{font:17px Georgia,serif;display:block;margin:5px 0}.teb-aside .teb-paper{display:grid;grid-template-columns:39px 1fr;padding:10px;gap:9px}.teb-aside .teb-paper strong{font-size:17px}.teb-aside .teb-paper .teb-arrow{grid-column:1/-1}.teb-dialog{width:min(500px,calc(100% - 32px));max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:22px;background:var(--surface);color:var(--ink)}.teb-dialog::backdrop{background:#25362a99}.teb-dialog h2{font:28px Georgia,serif}.teb-dialog img{width:100%;max-height:400px;object-fit:contain}.teb-dialog p{font-size:14px;line-height:1.6}.teb-close{float:right;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);padding:8px 12px}.teb-dialog label{display:grid;gap:6px;font-size:13px;margin:14px 0}.teb-dialog input{padding:10px;border:1px solid var(--line);border-radius:5px;font-size:16px;background:var(--paper);color:var(--ink)}.teb button:focus-visible,.choice:focus-visible{outline:3px solid #b95d36;outline-offset:3px}
@media(max-width:600px){.teb-main{padding:16px}.teb-header{padding:13px 16px}.teb-nav{gap:10px}.teb-nav span{display:none}.teb h1{font-size:31px}.teb-title{margin-bottom:18px}.teb-action{padding:11px 13px;font-size:11px}.teb-period h2{font-size:21px}.teb-switch{font-size:11px;gap:9px}.teb-photo-grid{grid-template-columns:1fr}.teb-event{display:grid;grid-template-columns:108px minmax(0,1fr)}.teb-event img{width:108px;height:100%;min-height:120px}.teb-event h3{font-size:20px}.teb-dates{gap:3px}.teb-news-grid{gap:10px}.teb-news-item img{height:64px}.teb-news-item h3{font-size:14px}.teb-source{font-size:10px}.teb-fixed-week{grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:0}.teb-fixed-day{min-height:100px;border-bottom:1px solid var(--line);padding-bottom:12px}.teb-fixed-day:last-child{border-bottom:1px solid var(--line)}.teb-fixed-label{display:flex;justify-content:center;align-items:center;gap:8px}.teb-chip{font-size:12px}.teb-chip img{height:70px}.teb-fixed-empty{padding:12px 0}.teb-ledger-day{grid-template-columns:38px minmax(0,1fr);gap:9px}.teb-ledger-date strong{font-size:27px}.teb-row-event{grid-template-columns:62px minmax(0,1fr) 10px;gap:9px;padding-right:8px}.teb-row-event img{width:62px;height:90px}.teb-row-event h3{font-size:17px}.teb-focus-layout{grid-template-columns:1fr}.teb-feature img{height:165px}.teb-aside .teb-paper{display:flex}.teb-aside .teb-paper .teb-arrow{margin-left:auto}.teb-paper{padding:12px;gap:10px}.teb-paper strong{font-size:17px}.teb-paper .teb-small{font-size:11px}.teb-paper .teb-arrow{white-space:normal;max-width:64px;font-size:11px}.choice{font-size:12px;padding:10px}.chooser{padding-right:0}.direction{font-size:12px}}
</style></head>
<body>
<div id="teb-directions">
<nav class="chooser" aria-label="Vælg en designretning">
<button type="button" class="choice" data-choice="photos" aria-pressed="true">Billedkort</button><button type="button" class="choice" data-choice="week" aria-pressed="false">Fast uge</button><button type="button" class="choice" data-choice="rows" aria-pressed="false">Dage på række</button><button type="button" class="choice" data-choice="focus" aria-pressed="false">Ét i fokus</button>
</nav><p class="direction" id="direction" aria-live="polite"></p>
<div class="teb"><header class="teb-header"><div class="teb-mark"><strong>TEB</strong><span>Tistrup</span></div><nav class="teb-nav" aria-label="Eksempel på hovedmenu"><span>Forside</span><span>Forening</span><b>Det sker</b><span>Om byen</span></nav></header><main class="teb-main"><div class="teb-title"><h1>Det <em>sker.</em></h1><button type="button" class="teb-action" data-compose>+ Del med byen</button></div><div id="calendar-draft"></div><section class="teb-news"><h2>Nyt <em>fra byen.</em></h2><div class="teb-news-grid" id="news-draft"></div></section></main><dialog class="teb-dialog" id="teb-dialog" aria-labelledby="dialog-title"><button type="button" class="teb-close" id="teb-close">Luk</button><div id="dialog-content"></div></dialog></div>
</div>
<script>
const root=document.getElementById('teb-directions');
const images={meal:'/Users/marinushvelplund/Desktop/TEB-hjemmeside/output/det-sker-nye-udkast/assets/faellesspisning.jpg',woods:'/Users/marinushvelplund/Desktop/TEB-hjemmeside/output/det-sker-nye-udkast/assets/byskov.jpg',town:'/Users/marinushvelplund/Desktop/TEB-hjemmeside/output/det-sker-nye-udkast/assets/torv.jpg',paper:'/Users/marinushvelplund/Desktop/TEB-hjemmeside/output/det-sker-nye-udkast/assets/papirkalender.jpg'};
const events=[{id:0,day:'Man',date:19,time:'18.00',title:'Fællesspisning',place:'Hodde Tistrup Hallen',image:images.meal},{id:1,day:'Tir',date:20,time:'16.30',title:'En tur i byskoven',place:'Byskoven',image:images.woods},{id:2,day:'Tor',date:22,time:'19.00',title:'Fællessang',place:'Medborgerhuset',image:images.town},{id:3,day:'Lør',date:24,time:'10.00',title:'Liv på torvet',place:'Tistrup Torv',image:images.town}];
const descriptions={photos:'Billedkort · Datoerne giver overblik, og store billeder hjælper med at vælge. Udkast med eksempelindhold.',week:'Fast uge · Alle syv dage og deres arrangementer står i samme kalender. Udkast med eksempelindhold.',rows:'Dage på række · Dato, billede og arrangement samlet i korte rækker. Udkast med eksempelindhold.',focus:'Ét i fokus · Det næste arrangement får mest plads, resten af ugen står ved siden af. Udkast med eksempelindhold.'};
let selectedDay=null,current='photos';
const tag=e=>`${e.day}. ${e.date}. okt. · ${e.time}`;
const image=e=>`<img src="${e.image}" alt="">`;
const card=e=>`<button type="button" class="teb-event" data-event="${e.id}">${image(e)}<span class="teb-event-copy"><span class="teb-date-label">${tag(e)}</span><h3>${e.title}</h3><span class="teb-event-location">${e.place}</span></span></button>`;
const paper=()=>`<button type="button" class="teb-paper" data-paper><img src="${images.paper}" alt=""><span class="teb-paper-copy"><strong>Kalenderen på papir</strong><span class="teb-small">Til køleskabet og byens opslagstavler.</span></span><span class="teb-arrow">Se udgaver →</span></button>`;
const period=(title='Den kommende uge')=>`<div class="teb-period"><h2>${title}</h2><div class="teb-switch"><span class="on">Uge</span><span>Måned</span><span aria-hidden="true">← →</span></div></div>`;
function dates(){return `<div class="teb-dates">${['Man','Tir','Ons','Tor','Fre','Lør','Søn'].map((d,i)=>`<button type="button" class="teb-day ${selectedDay===i+19?'active':''}" data-day="${i+19}" aria-pressed="${selectedDay===i+19}">${d}<b>${i+19}</b></button>`).join('')}</div>`;}
function render(){
 document.getElementById('direction').textContent=descriptions[current];
 for(const b of root.querySelectorAll('[data-choice]'))b.setAttribute('aria-pressed',String(b.dataset.choice===current));
 let out=period(),items=selectedDay?events.filter(e=>e.date===selectedDay):events;
 if(current==='photos'){out+=dates()+`<div class="teb-photo-grid">${items.slice(0,3).map(card).join('')}</div>`;if(!items.length)out+='<p class="teb-small">Ingen arrangementer denne dag. Vælg en anden dato.</p>';if(items.length>3)out+=`<button type="button" class="teb-text-event" data-event="3"><span class="teb-date-label">Lør. 24. okt.</span><b>Liv på torvet</b><span>10.00 →</span></button>`;out+=paper();}
 if(current==='week'){out=`${period('19.–25. oktober')}<div class="teb-fixed-week">${['Man','Tir','Ons','Tor','Fre','Lør','Søn'].map((d,i)=>{const list=events.filter(e=>e.date===19+i);return `<section class="teb-fixed-day"><header class="teb-fixed-label">${d}<strong>${19+i}</strong></header>${list.length?list.map(e=>`<button type="button" class="teb-chip" data-event="${e.id}">${e.id===0||e.id===1?image(e):''}<span>${e.time}</span>${e.title}</button>`).join(''):'<div class="teb-fixed-empty">·</div>'}</section>`}).join('')}</div>${paper()}`;}
 if(current==='rows'){out+=`<div class="teb-ledger">${events.map(e=>`<section class="teb-ledger-day"><div class="teb-ledger-date">${e.day}.<strong>${e.date}</strong></div><div class="teb-ledger-events"><button type="button" class="teb-row-event" data-event="${e.id}">${image(e)}<span><span class="teb-date-label">Kl. ${e.time}</span><h3>${e.title}</h3><span class="teb-event-location">${e.place}</span></span><span aria-hidden="true">→</span></button></div></section>`).join('')}</div>${paper()}`;}
 if(current==='focus'){const e=events[0];out=`${period('Det næste i byen')}<div class="teb-focus-layout"><button type="button" class="teb-feature" data-event="0">${image(e)}<div class="teb-feature-copy"><span class="teb-date-label">${tag(e)}</span><h3>Spis sammen.<br>Mød nogen fra byen.</h3><p>Fællesspisning i Hodde Tistrup Hallen.</p><span class="teb-small">Se arrangementet →</span></div></button><aside class="teb-aside"><h3>Resten af ugen</h3>${events.slice(1).map(e=>`<button type="button" class="teb-aside-event" data-event="${e.id}"><span class="teb-date-label">${tag(e)}</span><strong>${e.title}</strong><span class="teb-event-location">${e.place}</span></button>`).join('')}${paper()}</aside></div>`;}
 document.getElementById('calendar-draft').innerHTML=out;
}
const stories=[{title:'Der sker noget i anlægget',source:'TISTRUP NYT',image:images.woods},{title:'Byen gør klar til efteråret',source:'PULSEN I VEST',image:images.town},{title:'Tak til byens frivillige',source:'TISTRUP NYT',image:images.meal}];
document.getElementById('news-draft').innerHTML=stories.map((s,i)=>`<article class="teb-news-item"><img src="${s.image}" alt=""><h3>${s.title}</h3><span class="teb-source">${s.source}</span></article>`).join('');
const dialog=document.getElementById('teb-dialog'),detail=document.getElementById('dialog-content');
function show(content){detail.innerHTML=content;if(!dialog.open)dialog.showModal();}
root.addEventListener('click',e=>{
 const choice=e.target.closest('[data-choice]');if(choice){current=choice.dataset.choice;selectedDay=null;render();return;}
 const day=e.target.closest('[data-day]');if(day){selectedDay=selectedDay===Number(day.dataset.day)?null:Number(day.dataset.day);render();return;}
 const event=e.target.closest('[data-event]');if(event){const item=events[Number(event.dataset.event)];show(`<h2 id="dialog-title">${item.title}</h2>${image(item)}<p>${tag(item)}<br>${item.place}</p><p>Eksempel på arrangementsvisningen.</p>`);return;}
 if(e.target.closest('[data-paper]')){show(`<h2 id="dialog-title">Kalenderen på papir</h2><p>Eksempel på en fysisk udgave · september og oktober 2026.</p><img src="${images.paper}" alt="TEBs trykte kalender for september og oktober 2026">`);return;}
 if(e.target.closest('[data-compose]'))show('<h2 id="dialog-title">Del med byen</h2><p>Eksempel på indgangen til oprettelse.</p><label>Hvad vil du dele?<input placeholder="Fx fællesspisning i hallen"></label><p>Arrangement, nyhed eller begge dele.</p>');
});
document.getElementById('teb-close').addEventListener('click',()=>dialog.close());
render();
window.tebDraft={select(key){current=key;selectedDay=null;render();},keys:Object.keys(descriptions)};
console.log('Four drafts ready. Current design: '+current);
</script></body></html>
