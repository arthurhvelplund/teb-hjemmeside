<script>
(()=>{
const root=document.getElementById('teb-prototype'),data=JSON.parse(document.getElementById('teb-data').textContent),results=root.querySelector('#teb-results'),search=root.querySelector('#teb-search'),category=root.querySelector('#teb-category');
const escape=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const value of [...new Set(data.map(a=>a.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'da'))){const option=document.createElement('option');option.value=value;option.textContent=value;category.append(option);}
function render(){const query=search.value.trim().toLocaleLowerCase('da'),filtered=data.filter(a=>(!category.value||a.category===category.value)&&[a.name,a.category,a.description,a.place].join(' ').toLocaleLowerCase('da').includes(query));
root.querySelector('#teb-count').textContent=filtered.length+' '+(filtered.length===1?'forening':'foreninger');
results.innerHTML=filtered.map(a=>{const initials=a.name.split(/[\s·-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('');return `<a class="teb-association" href="../forening.html?id=${encodeURIComponent(a.id)}" aria-label="Se forening: ${escape(a.name)}"><figure class="teb-photo ${a.imageKind==='logo'||a.imageKind==='poster'?'is-logo':''}">${a.imageUrl?`<img src="${escape(a.imageUrl)}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="teb-initials" aria-hidden="true">${escape(initials)}</span>`}</figure><div class="teb-copy"><h2>${escape(a.name)}</h2><p>${escape(a.category)}</p><div class="teb-card-action"><span>Se forening</span><span aria-hidden="true">→</span></div></div></a>`;}).join('')||'<p class="teb-empty">Ingen foreninger matcher din søgning.</p>';
}
search.addEventListener('input',render);category.addEventListener('change',render);root.querySelector('#teb-layout').addEventListener('change',e=>results.classList.toggle('is-list',e.target.value==='list'));
const filter=root.querySelector('.teb-filter-button');filter.addEventListener('click',()=>{const open=filter.getAttribute('aria-expanded')!=='true';filter.setAttribute('aria-expanded',String(open));root.querySelector('#teb-filters').hidden=!open;});
root.querySelector('.teb-menu').addEventListener('click',e=>{const open=e.target.getAttribute('aria-expanded')!=='true';e.target.setAttribute('aria-expanded',String(open));root.querySelector('#teb-mobile-nav').hidden=!open;});
for(const button of document.querySelectorAll('[data-device]'))button.addEventListener('click',()=>{root.classList.toggle('is-mobile',button.dataset.device==='mobile');for(const b of document.querySelectorAll('[data-device]'))b.setAttribute('aria-pressed',String(b===button));});
render();
})();
</script>
</body>
</html>
