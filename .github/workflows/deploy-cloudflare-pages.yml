name: Deploy TEB site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "cloudflare-form-worker/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Se om formular-Worker er ændret
        id: worker_changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- cloudflare-form-worker; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy form worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare-form-worker/wrangler.jsonc

      - name: Test formular og Turnstile i produktion
        if: steps.worker_changes.outputs.changed == 'true'
        shell: bash
        run: |
          status=$(curl --silent --show-error \
            --output /tmp/teb-form-config \
            --write-out "%{http_code}" \
            "https://teb-tistrup.dk/api/formular/config")

          if [ "$status" != "200" ]; then
            echo "Turnstile-konfigurationen svarede med HTTP $status"
            cat /tmp/teb-form-config
            exit 1
          fi

          if ! grep -Eq '"turnstileSiteKey":"[^"]+' /tmp/teb-form-config; then
            echo "Turnstile-site key mangler i produktionskonfigurationen."
            cat /tmp/teb-form-config
            exit 1
          fi

          echo "Formular-Workeren og Turnstile-konfigurationen er aktive."

      - name: Deploy site/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=teb-tistrup --branch=main
