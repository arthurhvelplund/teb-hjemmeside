name: Deploy TEB site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "cloudflare-form-worker/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Se om formular-Worker er ændret
        id: worker_changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- cloudflare-form-worker; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy form worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare-form-worker/wrangler.jsonc

      - name: Test formular og e-mail i produktion
        if: steps.worker_changes.outputs.changed == 'true'
        shell: bash
        run: |
          status=$(curl --silent --show-error             --output /tmp/teb-form-body             --write-out "%{http_code}"             --request POST "https://teb-tistrup.dk/api/formular"             --header "Origin: https://teb-tistrup.dk"             --header "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "formular=kontakt"             --data-urlencode "navn=Automatisk udgivelsestest"             --data-urlencode "email=formular@teb-tistrup.dk"             --data-urlencode "emne=Kontrol af formular og e-mail"             --data-urlencode "besked=Denne besked bekræfter, at formularen og Cloudflare Email Sending virker efter en udgivelse.")

          if [ "$status" != "303" ]; then
            echo "Formularen svarede med HTTP $status"
            cat /tmp/teb-form-body
            exit 1
          fi

          echo "Formularen er godkendt, og Cloudflare har accepteret e-mailen."

      - name: Deploy site/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=teb-tistrup --branch=main
